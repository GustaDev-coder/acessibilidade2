<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="logoGradPrimary" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="logoGradAccent" x1="60" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Anel Externo de Conexão -->
  <circle cx="60" cy="60" r="50" stroke="url(#logoGradPrimary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="220 60" />
  
  <!-- Núcleo de Visão e Foco -->
  <circle cx="60" cy="60" r="16" fill="url(#logoGradAccent)" />
  
  <!-- Arcos Humano / Harmonia -->
  <path d="M 35 60 C 35 42, 42 35, 60 35 C 78 35, 85 42, 85 60" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 30 75 C 40 90, 80 90, 90 75" stroke="url(#logoGradPrimary)" stroke-width="6" stroke-linecap="round" />
</svg>
